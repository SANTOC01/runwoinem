<div class="challenge-container">
  <div class="content-wrapper">
    <div class="header">
      <h1>{{ config.title }}</h1>
      <app-goal-banner
        [total]="total"
        [goals]="config.goals"
        [unit]="config.metricUnit">
      </app-goal-banner>
    </div>

    <div class="data-section final-ranking">
      <app-ranking-table
        [rankings]="rankings"
        [unit]="config.metricUnit">
      </app-ranking-table>
    </div>

    <div class="progress-section">
      <div class="progress-header">
        <h2>📈 Fortschritt Gesamt: {{ total }} {{ config.metricUnit }}</h2>
        <div class="progress-bar">
          <div class="progress" [style.width.%]="progressPercentage">
            {{ progressPercentage }}%
          </div>
        </div>
      </div>
      <app-progress-chart
        [total]="total"
        [config]="config">
      </app-progress-chart>
    </div>
  </div>
</div>
