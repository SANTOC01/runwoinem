<div class="challenge-container">
  <div class="content-wrapper">
    <div class="header">
      <h1>{{ challengeService.config.title }}</h1>
      <app-goal-banner
        [total]="total()"
        [goals]="challengeService.config.goals"
        [unit]="challengeService.config.metricUnit">
      </app-goal-banner>
    </div>

    <app-challenge-form
      [config]="challengeService.config"
      (submitted)="onSubmit($event)"
      (valueChanged)="onValueChange($event)">
    </app-challenge-form>

    <div class="data-section">
      <app-stats-table
        [entries]="entries()"
        [unit]="challengeService.config.metricUnit"
        (deleteRequested)="onDelete($event)">
      </app-stats-table>
      <app-ranking-table
        [rankings]="rankings()"
        [unit]="challengeService.config.metricUnit">
      </app-ranking-table>
    </div>

    <div class="progress-section">
      <div class="progress-header">
        <h2>📈 Fortschritt Gesamt: {{ total() }} {{challengeService.config.metricUnit}}</h2>
        <div class="progress-bar">
          <div class="progress" [style.width.%]="progressPercentage()">
            {{ progressPercentage() }}%
          </div>
        </div>
      </div>
      <app-progress-chart
        [total]="total()"
        [config]="challengeService.config">
      </app-progress-chart>
    </div>
  </div>

  @if (lockService.visible()) {
    <app-lock-screen
      (success)="lockService.handleUnlockSuccess()"
      (cancel)="lockService.handleUnlockCancel()">
    </app-lock-screen>
  }
</div>
