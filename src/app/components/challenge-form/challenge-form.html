<div class="input-section">
  <input
    type="text"
    [(ngModel)]="name"
    placeholder="Dein Name"
    [disabled]="!config().active"/>
  <input
    type="number"
    [(ngModel)]="value"
    [placeholder]="config().metricLabel"
    [max]="config().maxEntryValue"
    [disabled]="!config().active"
    (input)="onValueChange()"/>
  <select
    [(ngModel)]="day"
    aria-label="Wann bist du gelaufen?"
    title="Wann bist du gelaufen?"
    [disabled]="!config().active">
    @for (option of dayOptions; track option.value) {
      <option [value]="option.value">{{ option.label }}</option>
    }
  </select>
  <button
    (click)="onSubmit()"
    [disabled]="!config().active || busy()"
    [class.disabled]="!config().active">
    {{ busy() ? 'Wird gespeichert…' : 'Absenden' }}
  </button>
  @if (!config().active) {
    <p class="challenge-status">🔒 Challenge beendet – danke für eure Teilnahme!</p>
  }
</div>
