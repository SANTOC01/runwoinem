<div class="ranking-container">
  <h2>🏆 Rangliste</h2>
  <table>
    <tr>
      <th>Platz</th>
      <th>Name</th>
      <th>{{ unit() }}</th>
    </tr>
    @for (rank of rankings(); track rank.name; let i = $index) {
      <tr [class.rank-up]="rankUp()?.name === rank.name"
          [style.--climb]="rankUp()?.name === rank.name ? climbRows(i) : null">
        <td>{{ getRankText(i, rank.name) }} {{ getRankEmoji(i) }}</td>
        <td>
          @if (clickable()) {
            <button type="button" class="name-link" (click)="nameSelected.emit(rank.name)">{{ rank.name }}</button>
          } @else {
            {{ rank.name }}
          }
        </td>
        <td>{{ rank.value }} {{ unit() }}</td>
      </tr>
    }
  </table>
</div>
