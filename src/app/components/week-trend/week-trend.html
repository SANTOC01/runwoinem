<div class="trend">
  <svg
    [attr.viewBox]="'0 0 ' + width + ' ' + height"
    [attr.width]="width"
    [attr.height]="height"
    role="img"
    [attr.aria-label]="ariaLabel()"
    (pointermove)="onPointer($event)"
    (pointerdown)="onPointer($event)"
    (pointerleave)="hovered.set(null)">
    <path class="area" [attr.d]="areaPath()" />
    <path class="line" [attr.d]="linePath()" />
    @if (marker(); as m) {
      @if (m.hovering) {
        <line class="crosshair" [attr.x1]="m.x" [attr.x2]="m.x" y1="0" [attr.y2]="height" />
      }
      <circle class="dot" [attr.cx]="m.x" [attr.cy]="m.y" r="4" />
    }
  </svg>
  <span class="readout" aria-live="polite">{{ readout() }}</span>
</div>
