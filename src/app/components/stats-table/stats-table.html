<div class="table-container">
  <h2>📋 Letzte Einträge</h2>

  <table>
    <tr>
      <th>Name</th>
      <th>{{unit}}</th>
      <th>Datum</th>
      <th>Löschen</th>
    </tr>
    @for (entry of entries; track entry.date + entry.name; let i = $index) {
      <tr>
        <td>{{entry.name}}</td>
        <td>
          {{entry.value}} {{unit}}
          @if (isBoosted?.(entry)) {
            <span class="boost-badge" title="Zählt doppelt für den Eurotrip">⚡</span>
          }
        </td>
        <td>{{formatDate(entry.date)}}</td>
        <td>
          @if (i === 0) {
            <button (click)="deleteEntry(entry)" class="delete-btn">❌</button>
          }
        </td>
      </tr>
    }
  </table>
  @if (hasBoosted && boostFootnote) {
    <p class="boost-footnote">{{ boostFootnote }}</p>
  }
</div>
